<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">What Slack, FaceTime and Discord give you built in</title><desc id="d">Slack has AI huddle notes on paid plans that notify everyone and do not work with guests; FaceTime records audio calls with one other person and both hear a notice; Discord has no built-in transcription. An app that listens to your Mac works in all three.</desc><rect width="900" height="330" rx="16" fill="#131519"/>
<text x="32" y="44" font-size="18" font-weight="700" fill="#f4f4f5">What each app gives you built in</text>
<text x="32" y="84" font-size="11" font-weight="700" fill="#a1a1aa" letter-spacing="1">APP</text>
<text x="160" y="84" font-size="11" font-weight="700" fill="#a1a1aa" letter-spacing="1">BUILT-IN OPTION</text>
<text x="470" y="84" font-size="11" font-weight="700" fill="#a1a1aa" letter-spacing="1">WHO IS TOLD</text>
<text x="690" y="84" font-size="11" font-weight="700" fill="#a1a1aa" letter-spacing="1">LIMIT</text>
<rect x="24" y="98" width="852" height="48" rx="10" fill="#1a1d23" stroke="#3f3f46"/>
<text x="40" y="127" font-size="13" font-weight="700" fill="#f4f4f5">Slack huddle</text>
<text x="160" y="127" font-size="13" fill="#f4f4f5">AI notes with transcript</text>
<text x="478" y="127" font-size="13" fill="#f4f4f5">Everyone in the huddle</text>
<text x="698" y="127" font-size="13" fill="#f4f4f5">Paid plans, no guests</text>
<rect x="24" y="154" width="852" height="48" rx="10" fill="#1a1d23" stroke="#3f3f46"/>
<text x="40" y="183" font-size="13" font-weight="700" fill="#f4f4f5">FaceTime</text>
<text x="160" y="183" font-size="13" fill="#f4f4f5">Call Recording into Notes</text>
<text x="478" y="183" font-size="13" fill="#f4f4f5">Both people hear a notice</text>
<text x="698" y="183" font-size="13" fill="#f4f4f5">Audio, one other person</text>
<rect x="24" y="210" width="852" height="48" rx="10" fill="#1a1d23" stroke="#3f3f46"/>
<text x="40" y="239" font-size="13" font-weight="700" fill="#f4f4f5">Discord</text>
<text x="160" y="239" font-size="13" fill="#f4f4f5">None found in search results</text>
<text x="478" y="239" font-size="13" fill="#f4f4f5">Bots join the channel</text>
<text x="698" y="239" font-size="13" fill="#f4f4f5">Server channels only</text>
<rect x="24" y="266" width="852" height="48" rx="10" fill="#1a2a22" stroke="#3f9b6a"/>
<text x="40" y="295" font-size="13" font-weight="700" fill="#f4f4f5">App on your Mac</text>
<text x="160" y="295" font-size="13" fill="#f4f4f5">Mic plus system audio</text>
<text x="478" y="295" font-size="13" fill="#f4f4f5">Not announced by the app</text>
<text x="698" y="295" font-size="13" fill="#f4f4f5">Mac only, you tell people</text></svg>
