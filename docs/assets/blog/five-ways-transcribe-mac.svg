<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Five ways to transcribe a meeting on a Mac</title><desc id="d">From built-in Notes and Voice Memos that hear only your microphone, to QuickTime with an audio driver, meeting bots, desktop apps you start yourself, and fully automatic apps that start on their own.</desc><rect width="900" height="380" rx="16" fill="#131519"/><text x="32" y="44" font-size="18" font-weight="700" fill="#f4f4f5">Five ways to transcribe a meeting on a Mac</text>
<text x="32" y="82" font-size="11" font-weight="700" fill="#a1a1aa" letter-spacing="1">WAY</text>
<text x="90" y="82" font-size="11" font-weight="700" fill="#a1a1aa" letter-spacing="1">TOOL</text>
<text x="430" y="82" font-size="11" font-weight="700" fill="#a1a1aa" letter-spacing="1">COST</text>
<text x="650" y="82" font-size="11" font-weight="700" fill="#a1a1aa" letter-spacing="1">WHAT IT HEARS</text>
<rect x="24" y="94" width="852" height="48" rx="10" fill="#1a1d23" stroke="#3f3f46"/><circle cx="50" cy="118" r="13" fill="#3f9b6a"/><text x="50" y="123" font-size="13" font-weight="700" fill="#0b0c0e" text-anchor="middle">1</text>
<text x="90" y="123" font-size="13" font-weight="700" fill="#f4f4f5">Notes or Voice Memos</text><text x="430" y="123" font-size="13" fill="#d4d4d8">Free, built in</text><text x="650" y="123" font-size="13" fill="#d4d4d8">Your mic input</text>
<rect x="24" y="152" width="852" height="48" rx="10" fill="#1a1d23" stroke="#3f3f46"/><circle cx="50" cy="176" r="13" fill="#3f9b6a"/><text x="50" y="181" font-size="13" font-weight="700" fill="#0b0c0e" text-anchor="middle">2</text>
<text x="90" y="181" font-size="13" font-weight="700" fill="#f4f4f5">QuickTime or OBS + audio driver</text><text x="430" y="181" font-size="13" fill="#d4d4d8">Free, several setup steps</text><text x="650" y="181" font-size="13" fill="#d4d4d8">Both sides, after setup</text>
<rect x="24" y="210" width="852" height="48" rx="10" fill="#1a1d23" stroke="#3f3f46"/><circle cx="50" cy="234" r="13" fill="#3f9b6a"/><text x="50" y="239" font-size="13" font-weight="700" fill="#0b0c0e" text-anchor="middle">3</text>
<text x="90" y="239" font-size="13" font-weight="700" fill="#f4f4f5">Meeting bot (Otter, Fireflies)</text><text x="430" y="239" font-size="13" fill="#d4d4d8">Free tier, then paid</text><text x="650" y="239" font-size="13" fill="#d4d4d8">Both sides, bot in the call</text>
<rect x="24" y="268" width="852" height="48" rx="10" fill="#1a1d23" stroke="#3f3f46"/><circle cx="50" cy="292" r="13" fill="#3f9b6a"/><text x="50" y="297" font-size="13" font-weight="700" fill="#0b0c0e" text-anchor="middle">4</text>
<text x="90" y="297" font-size="13" font-weight="700" fill="#f4f4f5">Desktop app you start</text><text x="430" y="297" font-size="13" fill="#d4d4d8">Free to 64 EUR once</text><text x="650" y="297" font-size="13" fill="#d4d4d8">Both sides, you press record</text>
<rect x="24" y="326" width="852" height="48" rx="10" fill="#1a2a22" stroke="#3f9b6a"/><circle cx="50" cy="350" r="13" fill="#3f9b6a"/><text x="50" y="355" font-size="13" font-weight="700" fill="#0b0c0e" text-anchor="middle">5</text>
<text x="90" y="355" font-size="13" font-weight="700" fill="#f4f4f5">Fully automatic app</text><text x="430" y="355" font-size="13" fill="#d4d4d8">Free (Routine Meeting)</text><text x="650" y="355" font-size="13" fill="#d4d4d8">Both sides, starts itself</text>
<text x="32" y="372" font-size="12" fill="#a1a1aa">Tell people you are recording, whichever way you choose.</text></svg>