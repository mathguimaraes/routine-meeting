<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">The four steps of a meeting recording</title><desc id="d">Capture, transcription, summary and storage can each happen on your Mac or in the cloud. A fully private setup keeps all four local.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="900" height="330" rx="16" fill="#131519"/><text x="32" y="44" font-size="18" font-weight="700" fill="#f4f4f5">Four steps, each can be local or cloud</text><rect x="32" y="70" width="196" height="110" rx="12" fill="#1a1d23" stroke="#3f3f46"/><text x="46" y="98" font-size="14" font-weight="700" fill="#f4f4f5">1 Capture</text><text x="46" y="122" font-size="12.5" fill="#d4d4d8">Bot joins the call</text><text x="46" y="140" font-size="12.5" fill="#d4d4d8">or app records your Mac</text><rect x="32" y="196" width="196" height="40" rx="8" fill="#1a2a22" stroke="#3f9b6a"/><text x="46" y="221" font-size="12.5" fill="#bfe6cf">Local: stays with you</text><rect x="32" y="244" width="196" height="40" rx="8" fill="#2a1f1f" stroke="#c2615a"/><text x="46" y="269" font-size="12.5" fill="#e4b8b4">Cloud: leaves your Mac</text><rect x="244" y="70" width="196" height="110" rx="12" fill="#1a1d23" stroke="#3f3f46"/><text x="258" y="98" font-size="14" font-weight="700" fill="#f4f4f5">2 Transcription</text><text x="258" y="122" font-size="12.5" fill="#d4d4d8">Runs on your Mac</text><text x="258" y="140" font-size="12.5" fill="#d4d4d8">or audio is uploaded</text><rect x="244" y="196" width="196" height="40" rx="8" fill="#1a2a22" stroke="#3f9b6a"/><text x="258" y="221" font-size="12.5" fill="#bfe6cf">Local: stays with you</text><rect x="244" y="244" width="196" height="40" rx="8" fill="#2a1f1f" stroke="#c2615a"/><text x="258" y="269" font-size="12.5" fill="#e4b8b4">Cloud: leaves your Mac</text><rect x="456" y="70" width="196" height="110" rx="12" fill="#1a1d23" stroke="#3f3f46"/><text x="470" y="98" font-size="14" font-weight="700" fill="#f4f4f5">3 Summary</text><text x="470" y="122" font-size="12.5" fill="#d4d4d8">Local model</text><text x="470" y="140" font-size="12.5" fill="#d4d4d8">or transcript sent to AI</text><rect x="456" y="196" width="196" height="40" rx="8" fill="#1a2a22" stroke="#3f9b6a"/><text x="470" y="221" font-size="12.5" fill="#bfe6cf">Local: stays with you</text><rect x="456" y="244" width="196" height="40" rx="8" fill="#2a1f1f" stroke="#c2615a"/><text x="470" y="269" font-size="12.5" fill="#e4b8b4">Cloud: leaves your Mac</text><rect x="668" y="70" width="196" height="110" rx="12" fill="#1a1d23" stroke="#3f3f46"/><text x="682" y="98" font-size="14" font-weight="700" fill="#f4f4f5">4 Storage</text><text x="682" y="122" font-size="12.5" fill="#d4d4d8">Files on your disk</text><text x="682" y="140" font-size="12.5" fill="#d4d4d8">or vendor servers</text><rect x="668" y="196" width="196" height="40" rx="8" fill="#1a2a22" stroke="#3f9b6a"/><text x="682" y="221" font-size="12.5" fill="#bfe6cf">Local: stays with you</text><rect x="668" y="244" width="196" height="40" rx="8" fill="#2a1f1f" stroke="#c2615a"/><text x="682" y="269" font-size="12.5" fill="#e4b8b4">Cloud: leaves your Mac</text><text x="32" y="312" font-size="13" fill="#a1a1aa">Ask four questions of any app, one per step. "No bot" only answers the first.</text></svg>