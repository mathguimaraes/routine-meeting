<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">From call start to transcript: MacWhisper and Routine Meeting</title><desc id="d">MacWhisper detects a meeting and shows a notification you click to record; Routine Meeting starts and stops by itself. Both transcribe after the call.</desc><rect width="900" height="340" rx="16" fill="#131519"/>
<text x="32" y="44" font-size="18" font-weight="700" fill="#f4f4f5">From call start to transcript</text>
<text x="32" y="84" font-size="11" font-weight="700" fill="#a1a1aa" letter-spacing="1">STEP</text>
<text x="200" y="84" font-size="11" font-weight="700" fill="#a1a1aa" letter-spacing="1">MACWHISPER (BETA MEETING MODE)</text>
<text x="560" y="84" font-size="11" font-weight="700" fill="#a1a1aa" letter-spacing="1">ROUTINE MEETING (PUBLIC BETA)</text>
<rect x="24" y="98" width="852" height="48" rx="10" fill="#1a1d23" stroke="#3f3f46"/>
<text x="40" y="127" font-size="13" font-weight="700" fill="#f4f4f5">1. Start</text>
<text x="200" y="127" font-size="13" fill="#f4f4f5">Notification, you click Record</text>
<text x="560" y="127" font-size="13" fill="#f4f4f5">Starts by itself</text>
<rect x="24" y="154" width="852" height="48" rx="10" fill="#1a1d23" stroke="#3f3f46"/>
<text x="40" y="183" font-size="13" font-weight="700" fill="#f4f4f5">2. Which apps</text>
<text x="200" y="183" font-size="13" fill="#f4f4f5">A list you can edit (no FaceTime)</text>
<text x="560" y="183" font-size="13" fill="#f4f4f5">Any app, by audio pattern</text>
<rect x="24" y="210" width="852" height="48" rx="10" fill="#1a1d23" stroke="#3f3f46"/>
<text x="40" y="239" font-size="13" font-weight="700" fill="#f4f4f5">3. Stop</text>
<text x="200" y="239" font-size="13" fill="#f4f4f5">You stop it or use the notification</text>
<text x="560" y="239" font-size="13" fill="#f4f4f5">Ends by itself</text>
<rect x="24" y="266" width="852" height="48" rx="10" fill="#1a2a22" stroke="#3f9b6a"/>
<text x="40" y="295" font-size="13" font-weight="700" fill="#f4f4f5">4. Transcript</text>
<text x="200" y="295" font-size="13" fill="#f4f4f5">After the call, local models</text>
<text x="560" y="295" font-size="13" fill="#f4f4f5">After the call, on your Mac</text>
<text x="32" y="330" font-size="11" fill="#a1a1aa">MacWhisper per docs.macwhisper.com, 2026-10-11. Routine Meeting from its own design.</text></svg>
