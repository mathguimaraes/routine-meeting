<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Where audio goes: a hosted notepad versus a local Mac app</title>
<desc id="d">Top row: a hosted notepad such as Granola captures audio on the Mac, sends it to third-party transcription providers, then to AI providers, and stores the notes in the vendor's cloud; the audio itself is not stored. Bottom row: a local app records, transcribes and summarizes on the Mac, and only sends transcript text out if a cloud summary is turned on.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs>
<rect width="900" height="420" rx="16" fill="#131519"/>
<text x="32" y="44" font-size="18" font-weight="700" fill="#f4f4f5">What leaves your Mac</text>
<text x="32" y="84" font-size="13" font-weight="700" fill="#a1a1aa" letter-spacing="1">HOSTED NOTEPAD (EXAMPLE: GRANOLA)</text>
<rect x="32" y="100" width="170" height="92" rx="12" fill="#1a1d23" stroke="#3f3f46"/>
<text x="48" y="130" font-size="15" font-weight="600" fill="#f4f4f5">Your Mac</text>
<text x="48" y="152" font-size="13" fill="#a1a1aa">Captures mic and</text><text x="48" y="170" font-size="13" fill="#a1a1aa">meeting audio</text>
<line x1="206" y1="146" x2="244" y2="146" stroke="#a1a1aa" stroke-width="2" marker-end="url(#a)"/>
<rect x="250" y="100" width="190" height="92" rx="12" fill="#2a1f1f" stroke="#c2615a"/>
<text x="266" y="130" font-size="15" font-weight="600" fill="#f4f4f5">Transcription providers</text>
<text x="266" y="152" font-size="13" fill="#e4b8b4">Audio is uploaded (names</text><text x="266" y="170" font-size="13" fill="#e4b8b4">Deepgram, AssemblyAI)</text>
<line x1="444" y1="146" x2="478" y2="146" stroke="#a1a1aa" stroke-width="2" marker-end="url(#a)"/>
<rect x="484" y="100" width="200" height="92" rx="12" fill="#2a1f1f" stroke="#c2615a"/>
<text x="500" y="130" font-size="15" font-weight="600" fill="#f4f4f5">AI providers</text>
<text x="500" y="150" font-size="13" fill="#e4b8b4">Transcript text for</text><text x="500" y="167" font-size="13" fill="#e4b8b4">summaries (OpenAI,</text><text x="500" y="184" font-size="13" fill="#e4b8b4">Anthropic)</text>
<line x1="688" y1="146" x2="708" y2="146" stroke="#a1a1aa" stroke-width="2" marker-end="url(#a)"/>
<rect x="714" y="100" width="154" height="92" rx="12" fill="#1a1d23" stroke="#3f3f46"/>
<text x="730" y="130" font-size="15" font-weight="600" fill="#f4f4f5">Vendor cloud</text>
<text x="730" y="152" font-size="13" fill="#a1a1aa">Notes stored (AWS, US).</text><text x="730" y="170" font-size="13" fill="#a1a1aa">Audio not kept.</text>
<text x="32" y="236" font-size="13" font-weight="700" fill="#a1a1aa" letter-spacing="1">LOCAL MAC APP (EXAMPLE: ROUTINE MEETING)</text>
<rect x="32" y="252" width="570" height="116" rx="12" fill="#14261d" stroke="#3f9b6a"/>
<text x="48" y="282" font-size="15" font-weight="600" fill="#f4f4f5">Your Mac, no network needed</text>
<rect x="48" y="298" width="150" height="56" rx="8" fill="#1a1d23" stroke="#3f3f46"/><text x="123" y="331" font-size="13" fill="#f4f4f5" text-anchor="middle">Record</text>
<line x1="200" y1="326" x2="224" y2="326" stroke="#a1a1aa" stroke-width="2" marker-end="url(#a)"/>
<rect x="230" y="298" width="150" height="56" rx="8" fill="#1a1d23" stroke="#3f3f46"/><text x="305" y="331" font-size="13" fill="#f4f4f5" text-anchor="middle">Transcribe</text>
<line x1="382" y1="326" x2="406" y2="326" stroke="#a1a1aa" stroke-width="2" marker-end="url(#a)"/>
<rect x="412" y="298" width="176" height="56" rx="8" fill="#1a1d23" stroke="#3f3f46"/><text x="500" y="331" font-size="13" fill="#f4f4f5" text-anchor="middle">Summary (local model)</text>
<path d="M602 310 H676" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)" fill="none"/>
<rect x="682" y="266" width="186" height="102" rx="12" fill="#1a1d23" stroke="#3f3f46" stroke-dasharray="6 5"/>
<text x="698" y="294" font-size="15" font-weight="600" fill="#f4f4f5">Cloud summary</text>
<text x="698" y="316" font-size="13" fill="#a1a1aa">Optional. Sends the</text><text x="698" y="334" font-size="13" fill="#a1a1aa">transcript text only,</text><text x="698" y="352" font-size="13" fill="#a1a1aa">never the audio.</text>
<text x="32" y="400" font-size="12" fill="#71717a">Based on Granola's security page and each local app's own site, checked 2026-10-06 to 2026-10-08. Apps differ; check the one you use.</text>
</svg>
