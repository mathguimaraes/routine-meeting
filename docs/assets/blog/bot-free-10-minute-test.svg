<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">A 10-minute test for any bot-free recorder</title><desc id="d">Five checks: participant list, Wi-Fi off, privacy page, what others are told, and whether it records the other side.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="900" height="300" rx="16" fill="#131519"/><text x="32" y="44" font-size="18" font-weight="700" fill="#f4f4f5">Test any bot-free app in 10 minutes</text><rect x="32" y="70" width="156" height="150" rx="12" fill="#1a1d23" stroke="#3f3f46"/><circle cx="58" cy="98" r="14" fill="#3f9b6a"/><text x="58" y="103" font-size="14" font-weight="700" fill="#0b0c0e" text-anchor="middle">1</text><text x="46" y="140" font-size="13" font-weight="700" fill="#f4f4f5">Join a test call</text><text x="46" y="164" font-size="12" fill="#d4d4d8">Anything in the</text><text x="46" y="182" font-size="12" fill="#d4d4d8">participant list?</text><rect x="200" y="70" width="156" height="150" rx="12" fill="#1a1d23" stroke="#3f3f46"/><circle cx="226" cy="98" r="14" fill="#3f9b6a"/><text x="226" y="103" font-size="14" font-weight="700" fill="#0b0c0e" text-anchor="middle">2</text><text x="214" y="140" font-size="13" font-weight="700" fill="#f4f4f5">Turn Wi-Fi off</text><text x="214" y="164" font-size="12" fill="#d4d4d8">Does transcription</text><text x="214" y="182" font-size="12" fill="#d4d4d8">still work?</text><rect x="368" y="70" width="156" height="150" rx="12" fill="#1a1d23" stroke="#3f3f46"/><circle cx="394" cy="98" r="14" fill="#3f9b6a"/><text x="394" y="103" font-size="14" font-weight="700" fill="#0b0c0e" text-anchor="middle">3</text><text x="382" y="140" font-size="13" font-weight="700" fill="#f4f4f5">Read privacy page</text><text x="382" y="164" font-size="12" fill="#d4d4d8">Where does speech</text><text x="382" y="182" font-size="12" fill="#d4d4d8">recognition run?</text><rect x="536" y="70" width="156" height="150" rx="12" fill="#1a1d23" stroke="#3f3f46"/><circle cx="562" cy="98" r="14" fill="#3f9b6a"/><text x="562" y="103" font-size="14" font-weight="700" fill="#0b0c0e" text-anchor="middle">4</text><text x="550" y="140" font-size="13" font-weight="700" fill="#f4f4f5">Check notices</text><text x="550" y="164" font-size="12" fill="#d4d4d8">What are other</text><text x="550" y="182" font-size="12" fill="#d4d4d8">people told?</text><rect x="704" y="70" width="156" height="150" rx="12" fill="#1a1d23" stroke="#3f3f46"/><circle cx="730" cy="98" r="14" fill="#3f9b6a"/><text x="730" y="103" font-size="14" font-weight="700" fill="#0b0c0e" text-anchor="middle">5</text><text x="718" y="140" font-size="13" font-weight="700" fill="#f4f4f5">Play the other side</text><text x="718" y="164" font-size="12" fill="#d4d4d8">Is their voice</text><text x="718" y="182" font-size="12" fill="#d4d4d8">captured too?</text><text x="32" y="260" font-size="13" fill="#a1a1aa">Then tell people you are recording. No test replaces that.</text></svg>