<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Five checks before you record a 1:1</title>
<desc id="d">Five steps in order: get consent, check where the audio goes, check whether a bot joins, check how long data is kept, and check who can read the notes.</desc>
<rect width="900" height="300" rx="16" fill="#131519"/>
<text x="32" y="44" font-size="18" font-weight="700" fill="#f4f4f5">Before you record a 1:1</text>
<g font-size="13" fill="#a1a1aa">
<rect x="32" y="76" width="152" height="150" rx="12" fill="#14261d" stroke="#3f9b6a"/>
<text x="48" y="104" font-size="12" font-weight="700" letter-spacing="1">1</text><text x="48" y="130" font-size="15" font-weight="600" fill="#f4f4f5">Consent</text><text x="48" y="156">Tell them and get</text><text x="48" y="174">a yes. They may not</text><text x="48" y="192">feel free to refuse.</text>
<rect x="196" y="76" width="152" height="150" rx="12" fill="#1a1d23" stroke="#3f3f46"/>
<text x="212" y="104" font-size="12" font-weight="700" letter-spacing="1">2</text><text x="212" y="130" font-size="15" font-weight="600" fill="#f4f4f5">Audio path</text><text x="212" y="156">On your Mac, or</text><text x="212" y="174">uploaded to a</text><text x="212" y="192">provider?</text>
<rect x="360" y="76" width="152" height="150" rx="12" fill="#1a1d23" stroke="#3f3f46"/>
<text x="376" y="104" font-size="12" font-weight="700" letter-spacing="1">3</text><text x="376" y="130" font-size="15" font-weight="600" fill="#f4f4f5">Bot in the call</text><text x="376" y="156">A visible bot changes</text><text x="376" y="174">how people talk</text><text x="376" y="192">one to one.</text>
<rect x="524" y="76" width="152" height="150" rx="12" fill="#1a1d23" stroke="#3f3f46"/>
<text x="540" y="104" font-size="12" font-weight="700" letter-spacing="1">4</text><text x="540" y="130" font-size="15" font-weight="600" fill="#f4f4f5">Retention</text><text x="540" y="156">How long audio and</text><text x="540" y="174">transcripts are kept,</text><text x="540" y="192">and the cleanup rule.</text>
<rect x="688" y="76" width="180" height="150" rx="12" fill="#1a1d23" stroke="#3f3f46"/>
<text x="704" y="104" font-size="12" font-weight="700" letter-spacing="1">5</text><text x="704" y="130" font-size="15" font-weight="600" fill="#f4f4f5">Who can read it</text><text x="704" y="156">Admins and sharing</text><text x="704" y="174">defaults on team</text><text x="704" y="192">plans.</text>
</g>
<text x="32" y="262" font-size="13" fill="#a1a1aa">Local recording does not change the law: many places require notice or consent from everyone.</text>
<text x="32" y="284" font-size="12" fill="#71717a">Order matters: consent comes first, before any tool choice.</text>
</svg>
