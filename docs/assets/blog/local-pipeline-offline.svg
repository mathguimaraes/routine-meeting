<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">A local meeting notes pipeline on a Mac</title><desc id="d">Audio is recorded, transcribed by a Whisper-family model on the Mac, then summarized by a local model such as one run through Ollama or MLX. Nothing needs a network connection after the models are downloaded.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="900" height="300" rx="16" fill="#131519"/><text x="32" y="44" font-size="18" font-weight="700" fill="#f4f4f5">A fully local pipeline, start to finish</text><rect x="32" y="76" width="176" height="100" rx="12" fill="#1a2a22" stroke="#3f9b6a"/><text x="46" y="104" font-size="14" font-weight="700" fill="#f4f4f5">Record</text><text x="46" y="128" font-size="12.5" fill="#d4d4d8">Mic plus system</text><text x="46" y="146" font-size="12.5" fill="#d4d4d8">audio on your Mac</text><line x1="212" y1="126" x2="238" y2="126" stroke="#a1a1aa" stroke-width="2" marker-end="url(#a)"/><rect x="244" y="76" width="176" height="100" rx="12" fill="#1a2a22" stroke="#3f9b6a"/><text x="258" y="104" font-size="14" font-weight="700" fill="#f4f4f5">Transcribe</text><text x="258" y="128" font-size="12.5" fill="#d4d4d8">Whisper-family</text><text x="258" y="146" font-size="12.5" fill="#d4d4d8">model, on device</text><line x1="424" y1="126" x2="450" y2="126" stroke="#a1a1aa" stroke-width="2" marker-end="url(#a)"/><rect x="456" y="76" width="176" height="100" rx="12" fill="#1a2a22" stroke="#3f9b6a"/><text x="470" y="104" font-size="14" font-weight="700" fill="#f4f4f5">Summarize</text><text x="470" y="128" font-size="12.5" fill="#d4d4d8">Local model via</text><text x="470" y="146" font-size="12.5" fill="#d4d4d8">Ollama or MLX</text><line x1="636" y1="126" x2="662" y2="126" stroke="#a1a1aa" stroke-width="2" marker-end="url(#a)"/><rect x="668" y="76" width="176" height="100" rx="12" fill="#1a2a22" stroke="#3f9b6a"/><text x="682" y="104" font-size="14" font-weight="700" fill="#f4f4f5">Keep</text><text x="682" y="128" font-size="12.5" fill="#d4d4d8">Transcript and</text><text x="682" y="146" font-size="12.5" fill="#d4d4d8">notes on your disk</text><rect x="32" y="204" width="836" height="64" rx="10" fill="#1a1d23" stroke="#3f3f46"/><text x="48" y="230" font-size="13" font-weight="700" fill="#f4f4f5">The offline test</text><text x="48" y="252" font-size="13" fill="#d4d4d8">Download the models once, turn Wi-Fi off, record a short call, and check each step still works.</text></svg>